# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-grinn-common-demo"
BBFILE_PATTERN_meta-grinn-common-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-grinn-common-demo = "11"

LAYERDEPENDS_meta-grinn-common-demo = "core"
LAYERSERIES_COMPAT_meta-grinn-common-demo = "scarthgap"
